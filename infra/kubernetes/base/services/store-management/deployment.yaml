apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-management
  labels:
    app.kubernetes.io/name: store-management
    app.kubernetes.io/part-of: tire-store
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: store-management
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-management
        app.kubernetes.io/part-of: tire-store
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: store-management
          image: tire-store/store-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8098
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8098"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
