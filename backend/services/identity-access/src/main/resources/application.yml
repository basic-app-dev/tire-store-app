spring:
  application:
    name: identity-access

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${IAM_DATABASE_URL}
    username: ${IAM_DATABASE_USERNAME}
    password: ${IAM_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8096

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true